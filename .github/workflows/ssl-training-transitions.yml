name: Native SSL training transitions
on:
  pull_request:
    paths:
      - 'backend/ml/self_supervised/**'
      - 'backend/ml/routes/ssl_routes.py'
      - 'backend/ml/tests/test_ssl*.py'
      - 'backend/ml/tests/test_moco_key_queue_protocol.py'
      - 'backend/ml/tests/test_simclr_pair_objective.py'
      - 'backend/ml/tests/test_mae_observation_objective.py'
      - '.github/workflows/ssl-training-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ssl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.8.0', '2.13.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1
      - name: Native recovery and existing SSL consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_ssl_training_transition.py backend/ml/tests/test_moco_key_queue_protocol.py backend/ml/tests/test_moco_forward_candidate.py backend/ml/tests/test_simclr_pair_objective.py backend/ml/tests/test_mae_observation_objective.py
      - name: Source analysis
        run: |
          python -m ruff check backend/ml/self_supervised/training_transition.py backend/ml/tests/test_ssl_training_transition.py
          python -m ruff check backend/ml/self_supervised/model.py backend/ml/routes/ssl_routes.py --select E9,F63,F7,F82,I,F401
