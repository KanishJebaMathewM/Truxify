name: Native foundation checkpoint generations
on:
  pull_request:
    paths:
      - 'backend/ml/foundation/**'
      - 'backend/ml/routes/foundation*.py'
      - 'backend/ml/tests/test_foundation*.py'
      - '.github/workflows/foundation-checkpoint-generations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.8.0', '2.13.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Scoped native dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 python-multipart==0.0.20 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Native paired generation and existing consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest backend/ml/tests/test_foundation_checkpoint_generation.py backend/ml/tests/test_foundation.py backend/ml/tests/test_foundation_attention_masks.py backend/ml/tests/test_foundation_mlm_objective.py backend/ml/tests/test_foundation_validation.py backend/ml/tests/test_foundation_finetuning.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/foundation/checkpoint_generation.py backend/ml/tests/test_foundation_checkpoint_generation.py
          python -m ruff check backend/ml/routes/foundation_routes.py --ignore I001,UP045,DTZ005,BLE001,B008
