services:
  gateway:
    image: nginx:alpine
    container_name: truxify-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ml-engine
    restart: unless-stopped

  api:
    build:
      context: ./backend/api
      target: development
    container_name: truxify-api
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/truxify_telemetry?authSource=admin
      MONGODB_DB_NAME: truxify_telemetry
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ML_API_KEY: ${ML_API_KEY:?ML_API_KEY is required}
      ML_ENGINE_URL: http://ml-engine:8000
      OSRM_BASE_URL: http://osrm:5000
      # Shard Configuration
      SHARD_NORTH_HOST: shard-north
      SHARD_NORTH_PORT: 5432
      SHARD_NORTH_DB: truxify_north
      SHARD_NORTH_USER: postgres
      SHARD_PASSWORD_NORTH: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      SHARD_SOUTH_HOST: shard-south
      SHARD_SOUTH_PORT: 5432
      SHARD_SOUTH_DB: truxify_south
      SHARD_SOUTH_USER: postgres
      SHARD_PASSWORD_SOUTH: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      SHARD_EAST_HOST: shard-east
      SHARD_EAST_PORT: 5432
      SHARD_EAST_DB: truxify_east
      SHARD_EAST_USER: postgres
      SHARD_PASSWORD_EAST: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      SHARD_WEST_HOST: shard-west
      SHARD_WEST_PORT: 5432
      SHARD_WEST_DB: truxify_west
      SHARD_WEST_USER: postgres
      SHARD_PASSWORD_WEST: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      # Malware scanning
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - ./backend/api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      shard-north:
        condition: service_healthy
      shard-south:
        condition: service_healthy
      shard-east:
        condition: service_healthy
      shard-west:
        condition: service_healthy
      osrm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health/live || curl -sf http://localhost:5000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ml-engine:
    build:
      context: ./backend/ml
    container_name: truxify-ml-engine
    env_file:
      - .env
    ports:
      - "8001:8000"
    environment:
      ML_API_KEY: ${ML_API_KEY:?ML_API_KEY is required}
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      osrm:
        condition: service_started
    volumes:
      - ./backend/ml:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  osrm:
    image: osrm/osrm-backend:latest
    container_name: truxify-osrm
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/india-latest.osrm
    ports:
      - "5002:5000"
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: truxify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: truxify
    # Database ports are NOT published to the host. Bind 127.0.0.1:5432:5432
    # for local CLI tools instead of exposing the DB on the LAN.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 🆕 GEOGRAPHIC SHARDING DATABASES
  # ============================================================================
  shard-north:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      POSTGRES_DB: truxify_north
    volumes:
      - shard_north_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shard-south:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      POSTGRES_DB: truxify_south
    volumes:
      - shard_south_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shard-east:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      POSTGRES_DB: truxify_east
    volumes:
      - shard_east_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shard-west:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      POSTGRES_DB: truxify_west
    volumes:
      - shard_west_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:6-jammy
    container_name: truxify-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USER}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: truxify-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Optional: ClamAV malware scanner ──────────────────
  # Uncomment to enable on-demand malware scanning for uploads.
  # Requires CLAMAV_HOST=clamav:3310 in the api service environment.
  # clamav:
  #   image: clamav/clamav:latest
  #   container_name: truxify-clamav
  #   ports:
  #     - "3310:3310"
  #   volumes:
  #     - clamav_data:/var/lib/clamav
  #   healthcheck:
  #     test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s
  #   restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: truxify-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - WEBHOOK_URL=http://localhost:5678/
      - INTERNAL_RELAYER_KEY=${INTERNAL_RELAYER_KEY:-local_relayer_secret}
      - ML_API_KEY=${ML_API_KEY:-local_ml_secret}
      - ML_ENGINE_URL=http://ml-engine:8000
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── ClamAV (optional malware scanning daemon) ──────────────────────────
  clamav:
    image: clamav/clamav:1.4
    container_name: truxify-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: ./infrastructure/backup
    container_name: truxify-backup
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SHARD_PASSWORD: ${SHARD_PASSWORD:?SHARD_PASSWORD is required}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
    depends_on:
      - db
      - shard-north
      - shard-south
      - shard-east
      - shard-west
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
  postgres_data:
  shard_north_data:
  shard_south_data:
  shard_east_data:
  shard_west_data:
  redis_data:
  # clamav_data:
  clamav_data:
  n8n_data:
