name: "Truxify App Analyzer"
description: "Multi-layer Flutter analysis with analyzer diagnostics, Semgrep, Dart metrics, AI review, deduplicated GitHub issues, and regression tracking"

inputs:
  app-name:
    description: "App directory name, for example customer or driver"
    required: true
  app-label:
    description: "GitHub label identifying the app"
    required: true
  theme-desc:
    description: "Short app context supplied to the AI reviewer"
    required: true
  gemini-api-key:
    description: "Gemini API key"
    required: false
    default: ""
  groq-api-key:
    description: "Groq API key"
    required: false
    default: ""
  openrouter-api-key:
    description: "OpenRouter API key used when earlier providers are unavailable"
    required: false
    default: ""
  force:
    description: "Run analysis even when the source hash is unchanged"
    required: false
    default: "false"
  ai-enabled:
    description: "Enable AI semantic review"
    required: false
    default: "true"
  max-ai-files:
    description: "Maximum number of Dart files reviewed by AI (0 means unlimited)"
    required: false
    default: "0"

outputs:
  hash:
    description: "Deterministic SHA-256 hash of analyzed source and relevant configuration"
    value: ${{ steps.hash.outputs.hash }}
  changed:
    description: "Whether analyzed inputs changed since the previous successful scan"
    value: ${{ steps.hash.outputs.changed }}
  findings:
    description: "Number of normalized findings processed"
    value: ${{ steps.issues.outputs.findings }}
  created:
    description: "Number of GitHub issues created"
    value: ${{ steps.issues.outputs.created }}
  updated:
    description: "Number of existing GitHub issues updated"
    value: ${{ steps.issues.outputs.updated }}
  reopened:
    description: "Number of previously closed findings reopened"
    value: ${{ steps.issues.outputs.reopened }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_LABEL: ${{ inputs.app-label }}
        FORCE_SCAN: ${{ inputs.force }}
        AI_ENABLED: ${{ inputs.ai-enabled }}
        MAX_AI_FILES: ${{ inputs.max-ai-files }}
      run: |
        set -euo pipefail
        [[ "$APP_NAME" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Invalid app-name"; exit 1; }
        [[ "$APP_LABEL" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Invalid app-label"; exit 1; }
        [[ "$FORCE_SCAN" == "true" || "$FORCE_SCAN" == "false" ]] || { echo "::error::force must be true or false"; exit 1; }
        [[ "$AI_ENABLED" == "true" || "$AI_ENABLED" == "false" ]] || { echo "::error::ai-enabled must be true or false"; exit 1; }
        [[ "$MAX_AI_FILES" =~ ^[0-9]+$ ]] || { echo "::error::max-ai-files must be a non-negative integer"; exit 1; }
        [[ -d "apps/$APP_NAME/lib" ]] || { echo "::error::Missing apps/$APP_NAME/lib"; exit 1; }

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        cache: true

    - name: Install Flutter dependencies
      shell: bash
      working-directory: apps/${{ inputs.app-name }}
      run: flutter pub get

    - name: Check source and configuration hash
      id: hash
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        FORCE_SCAN: ${{ inputs.force }}
      run: |
