# NetworkPolicy is enforced only by CNIs that support it. Apply these policies
# with the workloads so internal services are never exposed by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: truxify
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The API is the public entry point. Its existing Service targets port 5000;
# this rule also covers the alternative Argo Rollout pods labelled app=api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: truxify
spec:
  podSelector:
    matchLabels:
      app: truxify
      component: api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
---
# Optional Argo Rollout API pods have app=api rather than the Deployment labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-rollout-ingress
  namespace: truxify
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
---
# Redis and Postgres accept only traffic from API workloads in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-redis
  namespace: truxify
spec:
  podSelector:
    matchLabels:
      app: truxify
      component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: truxify
              component: api
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-shards
  namespace: truxify
spec:
  podSelector:
    matchLabels:
      app: truxify
      component: shard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: truxify
              component: api
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
---
# Both the Deployment and the optional ML Rollout use port 8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-ml
  namespace: truxify
spec:
  podSelector:
    matchLabels:
      app: truxify
      component: ml
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: truxify
              component: api
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-ml-rollout
  namespace: truxify
spec:
  podSelector:
    matchLabels:
      app: ml
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: truxify
              component: api
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000
