name: Native profit interval calibration
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/driver_profit.py'
      - 'backend/ml/app/models/profit_interval.py'
      - 'backend/ml/main.py'
      - 'backend/ml/tests/test_profit_interval_calibration.py'
      - 'backend/ml/tests/test_driver_profit_predictor.py'
      - '.github/workflows/profit-interval-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-profit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 ruff==0.16.9 numpy==1.26.4 scikit-learn==1.5.2 scipy==1.14.1 pandas==2.2.3 sqlalchemy==2.0.36 requests==2.32.3 aiohttp==3.11.11 redis==5.2.1 fastapi==0.115.6
      - name: Native signed intervals and matched generation controls
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_profit_interval_calibration.py backend/ml/tests/test_driver_profit_predictor.py backend/ml/tests/test_driver_profit_lifecycle.py backend/ml/tests/test_model_snapshot_consumers.py -q
      - name: Analyze scoped sources
        run: |
          python -m ruff check backend/ml/app/models/profit_interval.py backend/ml/tests/test_profit_interval_calibration.py
          python -m ruff check backend/ml/app/models/driver_profit.py backend/ml/main.py --select E9,F63,F7,F82
