name: Waypoint permutation completeness
on:
  pull_request:
    paths:
      - 'backend/api/src/services/routingService.js'
      - 'backend/api/test/unit/waypointPermutation.test.js'
      - 'backend/api/test/unit/routingService.test.js'
      - 'backend/api/test/unit/services/routingService.test.js'
      - 'tools/waypoint-permutation-tests/**'
      - '.github/workflows/waypoint-permutation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  waypoint-permutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            backend/api
            tools/waypoint-permutation-tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --prefix tools/waypoint-permutation-tests --ignore-scripts
      # Existing Haversine test expects throws, whereas main returns null.
      # Exclude only that unchanged baseline failure; see architecture note.
      - name: Verify complete permutations and existing routing behavior
        run: bash tools/waypoint-permutation-tests/run.sh --testNamePattern '^(?!.*should throw TypeError when non-finite coordinates)'
