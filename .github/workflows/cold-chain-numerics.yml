name: Cold-chain numerical regressions
on:
  pull_request:
    paths:
      - 'backend/ml/services/cold_chain_anomaly.py'
      - 'backend/ml/routes/cold_chain_routes.py'
      - 'backend/ml/tests/test_cold_chain_numerics.py'
      - '.github/workflows/cold-chain-numerics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1
      - run: python -m pytest backend/ml/tests/test_cold_chain_numerics.py -q
      - run: python -m ruff check backend/ml/services/cold_chain_anomaly.py backend/ml/routes/cold_chain_routes.py backend/ml/tests/test_cold_chain_numerics.py
