name: Transformer generation ownership
on:
  pull_request:
    paths:
      - backend/ml/transformers/model.py
      - backend/ml/app/execution.py
      - backend/ml/tests/test_transformer_generations.py
      - backend/ml/tests/test_transformers.py
      - tools/transformer-generation-tests/requirements.txt
      - .github/workflows/transformer-generations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/transformer-generation-tests/requirements.txt
      - name: Native trainer concurrency and checkpoint regressions
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_transformer_generations.py backend/ml/tests/test_transformers.py -k "not pydantic_train_request_constraints"
      - name: Scoped analysis
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/ml/transformers/model.py
          python -m ruff check backend/ml/tests/test_transformer_generations.py
