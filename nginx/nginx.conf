worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # Response compression
    #
    # Drivers use the apps on metered 3G/4G along national highways, so
    # transfer size is a direct cost to them. JSON list responses are highly
    # repetitive and compress well.
    # ------------------------------------------------------------------
    gzip on;

    # Below roughly one MTU the CPU cost is not repaid.
    gzip_min_length 1024;

    # Compress responses received from the upstream services too, not just
    # those nginx serves itself.
    gzip_proxied any;

    # Emit Vary: Accept-Encoding so shared caches never hand a gzipped body
    # to a client that did not ask for one.
    gzip_vary on;

    # zlib default; the knee of the size/CPU curve for JSON.
    gzip_comp_level 6;

    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/css
        text/javascript
        text/plain
        text/xml;

    # Legacy IE6 mishandles gzip; excluded rather than risking corrupt bodies.
    gzip_disable "msie6";

    # ------------------------------------------------------------------
    # Upload size & upstream timeouts
    #
    # Drivers upload KYC documents, POD scans and maintenance photos that can
    # exceed nginx's 1m default body limit, which produced spurious HTTP 413
    # responses. ML inference can run long, so upstream read/send timeouts
    # are raised to avoid premature HTTP 504 gateway timeouts.
    # ------------------------------------------------------------------
    client_max_body_size 25m;
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ------------------------------------------------------------------
    # Rate limiting
    #
    # The /api/v1/auth endpoint is the platform login surface. A brute-force
    # or credential-stuffing attack comes from one source spraying attempts,
    # so key the zone on the client address and allow a modest burst.
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ------------------------------------------------------------------
    # Security headers
    #
    # Applied to every response (the "always" flag covers error responses
    # too) so browsers refuse to sniff content, refuse framing, and pin the
    # site to HTTPS for two years.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    server {
        # TLS termination at the public edge. Certificates are mounted into
        # the container from a secret; without them nginx fails to start, so
        # the deployment must provide /etc/nginx/tls/{fullchain,privkey}.pem.
        listen 443 ssl;
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        # Redirect any plaintext access to the secure endpoint.
        error_page 497 https://$host$request_uri;

        # Node.js Auth Service
        location /api/v1/auth {
            # Brute-force protection: throttle login attempts per client.
            limit_req zone=auth burst=10 nodelay;

            rewrite ^/api/v1/auth(/.*)?$ /api/auth$1 break;
            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Node.js Trips Service
        location /api/v1/trips {
            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI ML Service
        location /api/v1/ml {
            rewrite ^/api/v1/ml$ / break;
            rewrite ^/api/v1/ml(/.*)?$ $1 break;
            proxy_pass http://ml-engine:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI Pricing Service
        location /api/v1/pricing {
            rewrite ^/api/v1/pricing$ / break;
            rewrite ^/api/v1/pricing(/.*)?$ $1 break;
            proxy_pass http://ml-engine:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
