
# Automatically monitor open pull requests for merge conflicts
name: Passive Merge Conflict Checker

# Run on pushes to main, every hour, or manually
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Allow the workflow to manage PR labels and comments
permissions:
  issues: write
  pull-requests: write

jobs:
  # Scan open pull requests and update their conflict status
  check-conflicts:
    name: Check Open PR Conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Retrieve and process open pull requests using GitHub API
      - name: Scan open PRs for merge conflicts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch all open pull requests
            const openPRs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "open",
                per_page: 100
              }
            );

            console.log(`Scanning ${openPRs.length} open PR(s)...`);

            // Create labels if they do not already exist
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description
                });
              } catch (error) {
                // Ignore the error if the label already exists
                if (error.status !== 422) throw error;
              }
            }

            for (const pr of openPRs) {
              try {
                // Fetch detailed PR information
                const fullPR = (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number
                })).data;

                // Mergeability may be null while GitHub is calculating it
                if (fullPR.mergeable === null) {
                  console.log(`Mergeability pending for PR #${pr.number}`);
                  continue;
                }

                // Determine the merge conflict status
                const isConflict =
                  fullPR.mergeable === false ||
                  fullPR.mergeable_state === "dirty";

                // Read existing PR labels
                const currentLabels = (fullPR.labels || []).map(
                  label => label.name.toLowerCase()
                );

                const hasConflictLabel =
                  currentLabels.includes("merge conflicts");

                const hasReadyLabel =
                  currentLabels.includes("merge ready");

                if (isConflict) {
                  // Add the conflict label and notify only once
                  if (!hasConflictLabel) {
                    await ensureLabel(
                      "merge conflicts",
                      "d73a4a",
                      "PR has merge conflicts"
                    );

                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: pr.number,
                      labels: ["merge conflicts"]
                    });

                    console.log(
                      `Added conflict label to PR #${pr.number}`
                    );

                    // Notify the PR author about the conflict
                    const author = fullPR.user?.login || "author";

                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: pr.number,
                      body: `@${author}, this pull request has merge conflicts. Please resolve them so it can be merged.`
                    });

                    console.log(
                      `Notified author of PR #${pr.number}`
                    );
                  }

                  // Remove the merge-ready label if conflicts exist
                  if (hasReadyLabel) {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: pr.number,
                      name: "merge ready"
                    });

                    console.log(
                      `Removed merge-ready label from PR #${pr.number}`
                    );
                  }
                } else if (fullPR.mergeable === true) {
                  // Mark the PR as ready to merge
                  if (!hasReadyLabel) {
                    await ensureLabel(
                      "merge ready",
                      "2cbe4e",
                      "PR is mergeable and has no conflicts"
                    );

                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: pr.number,
                      labels: ["merge ready"]
                    });

                    console.log(
                      `Added merge-ready label to PR #${pr.number}`
                    );
                  }

                  // Remove the conflict label when conflicts are resolved
                  if (hasConflictLabel) {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: pr.number,
                      name: "merge conflicts"
                    });

                    console.log(
                      `Removed conflict label from PR #${pr.number}`
                    );
                  }
                }
              } catch (error) {
                // Log errors without stopping the scan of other PRs
                console.error(
                  `Error processing PR #${pr.number}: ${error.message}`
                );
              }
            }
