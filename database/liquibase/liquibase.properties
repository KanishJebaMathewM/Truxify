# Liquibase Configuration
# The changelogs are a legacy standalone demo schema; they must never run
# against the application database ("truxify"). Use a dedicated database.
changeLogFile: changelog-master.xml
url: jdbc:postgresql://localhost:5432/truxify_liquibase
username: postgres
password: password
driver: org.postgresql.Driver
liquibase.schemaName: public
liquibase.databaseChangeLogTableName: DATABASECHANGELOG
liquibase.databaseChangeLogLockTableName: DATABASECHANGELOGLOCK