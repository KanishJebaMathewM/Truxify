
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
}

http {

    # ============================================================
    # 1. BASIC PERFORMANCE SETTINGS
    # ============================================================

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 300s;

    # ============================================================
    # 2. GZIP COMPRESSION
    # ============================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;

    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;

    gzip_http_version 1.1;

    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    gzip_disable "msie6";

    # ============================================================
    # 3. REQUEST SIZE AND TIMEOUT CONFIGURATION
    # ============================================================

    client_max_body_size 25m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ============================================================
    # 4. RATE LIMITING AND CONNECTION PROTECTION
    # ============================================================

    # Authentication: 5 requests per second per client IP

    limit_req_zone $binary_remote_addr
        zone=auth:10m
        rate=5r/s;

    # General API protection

    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=20r/s;

    # Limit simultaneous connections per client IP

    limit_conn_zone $binary_remote_addr
        zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    limit_req_log_level warn;

    # ============================================================
    # 5. WEBSOCKET SUPPORT
    # ============================================================

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ============================================================
    # 6. UPSTREAM SERVICES
    # ============================================================

    upstream api_backend {

        server api:5000;

        keepalive 32;
    }

    upstream ml_backend {

        server ml-engine:8000;

        keepalive 16;
    }

    # ============================================================
    # 7. HTTP TO HTTPS REDIRECTION
    # ============================================================

    server {

        listen 80 default_server;
        server_name _;

        return 308 https://$host$request_uri;
    }

    # ============================================================
    # 8. MAIN HTTPS SERVER
    # ============================================================

    server {

        listen 443 ssl;
        server_name _;

        # --------------------------------------------------------
        # TLS CONFIGURATION
        # --------------------------------------------------------

        ssl_certificate
            /etc/nginx/tls/fullchain.pem;

        ssl_certificate_key
            /etc/nginx/tls/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        ssl_prefer_server_ciphers off;

        # Redirect legacy HTTP requests received on TLS port

        error_page 497 https://$host$request_uri;

        # --------------------------------------------------------
        # SECURITY HEADERS
        # --------------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "DENY" always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin" always;

        add_header Strict-Transport-Security
            "max-age=63072000" always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()" always;

        # --------------------------------------------------------
        # CONNECTION LIMIT
        # --------------------------------------------------------

        limit_conn conn_limit 50;

        # --------------------------------------------------------
        # COMMON PROXY SETTINGS
        # --------------------------------------------------------

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Use the direct client IP at this Nginx edge.
        # Configure trusted real-IP proxies separately if needed.

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ========================================================
        # 9. AUTHENTICATION SERVICE
        # ========================================================

        location = /api/v1/auth {

            limit_req zone=auth burst=10 nodelay;

            rewrite ^/api/v1/auth$ /api/auth break;

            proxy_pass http://api_backend;
        }

        location ^~ /api/v1/auth/ {

            limit_req zone=auth burst=10 nodelay;

            rewrite ^/api/v1/auth(/.*)$ /api/auth$1 break;

            proxy_pass http://api_backend;
        }

        # ========================================================
        # 10. TRIPS SERVICE
        # ========================================================

        location = /api/v1/trips {

            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://api_backend;
        }

        location ^~ /api/v1/trips/ {

            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://api_backend;
        }

        # ========================================================
        # 11. MACHINE LEARNING SERVICE
        # ========================================================

        location = /api/v1/ml {

            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/v1/ml$ / break;

            proxy_pass http://ml_backend;
        }

        location ^~ /api/v1/ml/ {

            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/v1/ml(/.*)$ $1 break;

            proxy_pass http://ml_backend;
        }

        # ========================================================
        # 12. PRICING SERVICE
        # ========================================================

        location = /api/v1/pricing {

            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/v1/pricing$ / break;

            proxy_pass http://ml_backend;
        }

        location ^~ /api/v1/pricing/ {

            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/v1/pricing(/.*)$ $1 break;

            proxy_pass http://ml_backend;
        }

        # ========================================================
        # 13. HEALTH CHECK
        # ========================================================

        location = /health {

            access_log off;

            default_type application/json;

            return 200 '{"status":"healthy","service":"nginx"}';
        }

        # ========================================================
        # 14. BLOCK UNDEFINED API ROUTES
        # ========================================================

        location /api/ {

            default_type application/json;

            return 404 '{"error":"API endpoint not found"}';
        }

        # ========================================================
        # 15. ERROR HANDLING
        # ========================================================

        error_page 413 /errors/413.json;
        error_page 502 503 504 /errors/50x.json;

        location = /errors/413.json {
            internal;
            default_type application/json;
            return 413 '{"error":"Request payload too large"}';
        }

        location = /errors/50x.json {
            internal;
            default_type application/json;
            return 503 '{"error":"Upstream service temporarily unavailable"}';
        }
    }
}
