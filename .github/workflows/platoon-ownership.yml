name: Native platoon ownership
on:
  pull_request:
    paths:
      - 'backend/api/src/services/platooningCoordinatorService.js'
      - 'backend/api/src/controllers/platoonController.js'
      - 'backend/api/test/native/platoonOwnership.test.js'
      - '.github/workflows/platoon-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install isolated actual logger and scoped lint dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/platoon-deps" --ignore-scripts --no-audit --no-fund pino@10.3.1 eslint@9.39.5 @eslint/js@9.39.5 globals@17.12.0
          ln -s "$RUNNER_TEMP/platoon-deps/node_modules" backend/api/node_modules
      - name: Native ownership and controller tests
        run: node --test backend/api/test/native/platoonOwnership.test.js
      - name: Scoped backend analysis
        working-directory: backend/api
        run: node node_modules/eslint/bin/eslint.js src/services/platooningCoordinatorService.js test/native/platoonOwnership.test.js --max-warnings=0
