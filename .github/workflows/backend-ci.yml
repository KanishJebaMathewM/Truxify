
# Backend CI workflow for testing backend API changes
name: Backend CI

# Trigger the workflow for backend API pull requests and pushes to main
on:
  pull_request:
    paths:
      - "backend/api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/api/**"
      - ".github/workflows/backend-ci.yml"

# Cancel older workflow runs for the same branch or PR reference
concurrency:
  group: truxify-backend-ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict workflow permissions to read repository contents
permissions:
  contents: read

jobs:
  # Run backend unit tests in four parallel shards
  unit-tests:
    name: Backend Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Divide tests into four parallel jobs
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # Checkout the repository securely
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Install Node.js 22
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      # Install backend dependencies
      - name: Install dependencies
        working-directory: backend/api
        run: npm ci --workspaces=false --legacy-peer-deps --ignore-scripts

      # Run test files across four shards, excluding integration tests
      - name: Run tests (shard ${{ matrix.shard }}/4)
        working-directory: backend/api
        run: npx vitest run --exclude "test/integration/**" --shard=${{ matrix.shard }}/4

  # Run integration tests using PostgreSQL and Redis
  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Wait for all unit-test shards to complete successfully
    needs: unit-tests

    # Start PostgreSQL and Redis containers
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truxify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Set environment variables for integration tests
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truxify_test
      REDIS_URL: redis://localhost:6379

    steps:
      # Checkout the repository securely
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Install Node.js 22
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      # Install backend dependencies
      - name: Install dependencies
        working-directory: backend/api
        run: npm ci --workspaces=false --legacy-peer-deps --ignore-scripts

      # Execute backend integration tests
      - name: Run integration tests
        working-directory: backend/api
        run: npm run test:integration
