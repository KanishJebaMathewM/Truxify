name: ML mid-trip insertion algorithm
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/mid_trip_reoptimiser.py'
      - 'backend/ml/tests/test_mid_trip*.py'
      - '.github/workflows/ml-mid-trip-insertion.yml'
permissions:
  contents: read
jobs:
  insertion-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 fastapi==0.142.2 requests==2.34.2 ruff==0.16.9
      - name: Directed route oracle, deadline selection and work bounds
        env:
          PYTHONPATH: backend/ml
        run: |
          python -m pytest -q backend/ml/tests/test_mid_trip_insertion_complexity.py backend/ml/tests/test_mid_trip_deadline_insertion.py backend/ml/tests/test_mid_trip_road_eta.py backend/ml/tests/test_mid_trip_payment_validation.py
          ruff check backend/ml/tests/test_mid_trip_insertion_complexity.py
