name: Native demand generation decisions
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/demand_forecast.py'
      - 'backend/ml/app/models/demand_promotion.py'
      - 'backend/ml/tests/test_demand_generation_decisions.py'
      - 'backend/ml/tests/test_demand_cache_lifecycle.py'
      - '.github/workflows/demand-generation-decisions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        sklearn: ['1.5.2', '1.9.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 ruff==0.16.9 numpy==1.26.4 scikit-learn==${{ matrix.sklearn }} scipy==1.14.1 fastapi==0.115.6 requests==2.32.3
      - name: Native signed artifacts and competing writer decisions
        env:
          PYTHONPATH: backend/ml
          MODEL_ARTIFACT_SIGNATURE_DIR: ${{ runner.temp }}/demand-signatures
        run: python -m pytest backend/ml/tests/test_demand_generation_decisions.py backend/ml/tests/test_demand_cache_lifecycle.py backend/ml/tests/test_demand_forecast.py -q
      - name: Analyze scoped sources
        run: |
          python -m ruff check backend/ml/app/models/demand_promotion.py backend/ml/tests/test_demand_generation_decisions.py
          python -m ruff check backend/ml/app/models/demand_forecast.py backend/ml/tests/test_demand_cache_lifecycle.py --select E9,F63,F7,F82
