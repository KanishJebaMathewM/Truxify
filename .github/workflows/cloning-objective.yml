name: Native cloning objective
on:
  pull_request:
    paths:
      - 'backend/ml/imitation/model.py'
      - 'backend/ml/tests/test_cloning_objective.py'
      - '.github/workflows/cloning-objective.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cloning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1
      - name: Native cloning Adam and prior REINFORCE controls
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_cloning_objective.py backend/ml/tests/test_reinforce_logit_contract.py
      - name: Scoped analysis
        run: python -m ruff check backend/ml/imitation/model.py backend/ml/tests/test_cloning_objective.py --select E9,F63,F7,F82
