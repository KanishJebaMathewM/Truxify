name: Native GAT serving contract
on:
  pull_request:
    paths:
      - 'backend/ml/gat/**'
      - 'backend/ml/routes/gat_routes.py'
      - 'backend/ml/tests/test_gat*.py'
      - '.github/workflows/gat-serving-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gat-serving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1 python-multipart==0.0.20 pillow==11.3.0 torch-geometric==2.6.1 networkx==3.7
      - name: Native actual PyG batched gradients population statistics and mounted ownership
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_gat_serving_contract.py backend/ml/tests/test_gat_tensor_contract.py backend/ml/tests/test_gat_request_topology.py backend/ml/tests/test_gat_restore_transaction.py backend/ml/tests/test_gat.py backend/ml/tests/test_gat_temporal.py
      - name: Source analysis
        run: |
          python -m ruff check backend/ml/gat/serving_contract.py backend/ml/tests/test_gat_serving_contract.py
          python -m ruff check backend/ml/gat/model.py backend/ml/routes/gat_routes.py --select E9,F63,F7,F82,I,F401
