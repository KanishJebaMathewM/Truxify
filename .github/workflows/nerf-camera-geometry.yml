name: NeRF camera geometry
on:
  pull_request:
    paths:
      - 'backend/ml/nerf/camera.py'
      - 'backend/ml/tests/test_nerf_camera_geometry.py'
      - '.github/workflows/nerf-camera-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - run: python -m ruff check backend/ml/nerf/camera.py backend/ml/tests/test_nerf_camera_geometry.py
      - run: python -m pytest -q backend/ml/tests/test_nerf_camera_geometry.py
        env:
          PYTHONPATH: backend/ml
