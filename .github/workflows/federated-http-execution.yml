name: Native federated HTTP execution
on:
  pull_request:
    paths:
      - 'backend/ml/federated/**'
      - 'backend/ml/routes/federated_routes.py'
      - 'backend/ml/app/execution.py'
      - 'backend/ml/tests/test_federated*.py'
      - 'docs/architecture/federated*.md'
      - 'docs/ml/federated*.md'
      - '.github/workflows/federated-http-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - tensorflow: '2.16.1'
            keras: '3.3.3'
          - tensorflow: '2.16.2'
            keras: '3.15.1'
    env:
      PYTHONPATH: backend/ml
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install tensorflow-cpu==${{ matrix.tensorflow }} keras==${{ matrix.keras }} numpy==1.26.4 scipy==1.14.1 redis==5.0.8 cryptography==44.0.0 pytest==9.0.3 pytest-asyncio==1.3.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1
      - run: >-
          python -m pytest backend/ml/tests/test_federated_http_execution.py
          backend/ml/tests/test_federated_local_training_transition.py
          backend/ml/tests/test_federated_round_recovery.py
          backend/ml/tests/test_federated_model_admission.py backend/ml/tests/test_federated.py
          backend/ml/tests/test_federated_client_round_protocol.py -q
      - run: |
          python -m ruff check backend/ml/federated/http_execution.py backend/ml/tests/test_federated_http_execution.py
          python -m ruff check backend/ml/federated/federated_client.py --ignore I001,F401,UP035,UP006,BLE001,S110,SIM102,F541
          python -m ruff check backend/ml/routes/federated_routes.py --ignore I001,UP035,F401,UP006,UP045,BLE001,F841,RUF059
