name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "backend/api/**"
      - "backend/ml/**"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: truxify-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Build and push API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Checkout previous commit for canary
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.before }}
          path: previous

      - name: Build and push API canary (previous ref)
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./previous/backend/api
          target: production
          push: true
          tags: |
            ghcr.io/kanishjebamathewm/truxify-api:canary

      - name: Build and push API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: backend/api
          target: production
          push: true
          tags: |
            ghcr.io/kanishjebamathewm/truxify-api:latest
            ghcr.io/kanishjebamathewm/truxify-api:${{ github.sha }}

  ml:
    name: Build and push ML image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and push ML
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: backend/ml
          push: true
          tags: |
            ghcr.io/kanishjebamathewm/truxify-ml:latest
            ghcr.io/kanishjebamathewm/truxify-ml:${{ github.sha }}
