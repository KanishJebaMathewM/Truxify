name: Rust verifier connection lifecycle
on:
  pull_request:
    paths:
      - 'services/zkp-verifier-rust/src/main.rs'
      - 'tools/zkp-http-tests/**'
      - '.github/workflows/zkp-connection-lifecycle.yml'
permissions:
  contents: read
jobs:
  bounded-admission-and-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select verified Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - run: bash tools/zkp-http-tests/run.sh
