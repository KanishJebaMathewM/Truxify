name: GNN ASGI dispatch
on:
  pull_request:
    paths:
      - backend/ml/routes/gnn_routes.py
      - backend/ml/routes/_gnn_event_loop_isolation_patch.py
      - backend/ml/tests/test_gnn_asgi_dispatch.py
      - backend/ml/tests/test_gnn_event_loop_isolation.py
      - tools/gnn-dispatch-tests/requirements.txt
      - .github/workflows/gnn-asgi-dispatch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-asgi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/gnn-dispatch-tests/requirements.txt
      - name: Actual FastAPI registry and ASGI requests
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_gnn_asgi_dispatch.py backend/ml/tests/test_gnn_event_loop_isolation.py
      - name: Scoped analysis
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/ml/routes/gnn_routes.py backend/ml/routes/_gnn_event_loop_isolation_patch.py
          python -m ruff check backend/ml/tests/test_gnn_asgi_dispatch.py
