name: Native GAT observed training
on:
  pull_request:
    paths:
      - 'backend/ml/gat/model.py'
      - 'backend/ml/gat/training_transition.py'
      - 'backend/ml/routes/gat_routes.py'
      - 'backend/ml/tests/test_gat_observed_training.py'
      - '.github/workflows/gat-observed-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-training:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scoped native dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 torch-geometric==2.6.1 networkx==3.5 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Native observed training and prior graph/checkpoint consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest backend/ml/tests/test_gat_observed_training.py backend/ml/tests/test_gat_serving_contract.py backend/ml/tests/test_gat_tensor_contract.py backend/ml/tests/test_gat_request_topology.py backend/ml/tests/test_gat_restore_transaction.py backend/ml/tests/test_gat.py backend/ml/tests/test_gat_temporal.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/gat/training_transition.py backend/ml/tests/test_gat_observed_training.py
          python -m ruff check backend/ml/gat/model.py backend/ml/routes/gat_routes.py --ignore I001,F401,UP035,UP006,UP045,PLR0402,DTZ005,BLE001
