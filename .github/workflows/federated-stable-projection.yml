name: Native federated stable projection
on:
  pull_request:
    paths:
      - 'backend/ml/federated/fl_server.py'
      - 'backend/ml/tests/test_federated_stable_projection.py'
      - '.github/workflows/federated-stable-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-median:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native numerical dependencies
        run: python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Native coordinate median and bounded projection
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest -q backend/ml/tests/test_federated_stable_projection.py
      - name: Scoped analysis
        run: python -m ruff check backend/ml/federated/fl_server.py backend/ml/tests/test_federated_stable_projection.py --select E9,F63,F7,F82
