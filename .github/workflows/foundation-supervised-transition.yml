name: Native foundation supervised transition
on:
  pull_request:
    paths:
      - 'backend/ml/foundation/**'
      - 'backend/ml/tests/test_foundation*.py'
      - 'backend/ml/tests/test_mlm_optimizer_transition.py'
      - '.github/workflows/foundation-supervised-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-supervised:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scoped native dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Native supervised and existing masked consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest backend/ml/tests/test_foundation_supervised_transition.py backend/ml/tests/test_mlm_optimizer_transition.py backend/ml/tests/test_foundation.py backend/ml/tests/test_foundation_attention_masks.py backend/ml/tests/test_foundation_mlm_objective.py backend/ml/tests/test_foundation_validation.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/foundation/supervised_batch.py backend/ml/foundation/optimizer_transition.py backend/ml/tests/test_foundation_supervised_transition.py
          python -m ruff check backend/ml/foundation/model.py --ignore I001,PLR0402,UP035,UP045,UP006,DTZ005
