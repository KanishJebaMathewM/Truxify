name: Truxify CI

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'blockchain/**'
      - 'backend/ml/**'
  push:
    branches:
      - main

concurrency:
  group: truxify-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: backend/api
        run: npm install --workspaces=false --legacy-peer-deps

      - name: Run unit tests
        working-directory: backend/api
        run: npm run test:unit

      - name: Run integration tests
        working-directory: backend/api
        run: npm run test:integration

  customer:
    name: Customer Flutter & Android APK checks
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Get shared dependencies
        working-directory: packages/truxify_shared
        run: flutter pub get

      - name: Get dependencies
        working-directory: apps/customer
        run: flutter pub get

      - name: Analyze
        working-directory: apps/customer
        run: flutter analyze

      - name: Test
        working-directory: apps/customer
        run: flutter test

      - name: Build Android APK
        working-directory: apps/customer
        run: flutter build apk --debug --no-pub

  driver:
    name: Driver Flutter & Android APK checks
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Get shared dependencies
        working-directory: packages/truxify_shared
        run: flutter pub get

      - name: Get dependencies
        working-directory: apps/driver
        run: flutter pub get

      - name: Analyze
        working-directory: apps/driver
        run: flutter analyze

      - name: Test
        working-directory: apps/driver
        run: flutter test

      - name: Build Android APK
        working-directory: apps/driver
        run: flutter build apk --debug --no-pub

  ml:
    name: ML engine tests
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt

        - name: Install system dependencies
          run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopenblas-dev

        - name: Install dependencies
          working-directory: backend/ml
          run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend/ml
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

      - name: Run eBPF tests
        run: python -m pytest ebpf/tests -v

  cuda:
    name: CUDA VRP build & tests
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build and test CUDA VRP
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            nvidia/cuda:12.6.3-devel-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake
              cmake -S services/gpu-routing-cuda -B build
              cmake --build build --parallel
              ctest --test-dir build --output-on-failure
            '

  contracts:
    name: Smart contract checks
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        working-directory: blockchain
        run: npm ci

      - name: Compile contracts
        working-directory: blockchain
        run: npx hardhat compile

      - name: Run contract tests
        working-directory: blockchain
        run: npx hardhat test

      - name: Verify backend ABI selectors match compiled contract
        run: bash scripts/check-escrow-abi.sh

  client-credentials-guard:
    name: No client-side backend credentials
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check for Redis/Upstash credentials in Flutter source
        run: bash scripts/check-no-client-credentials.sh
