name: GTN meta-path regressions
on:
  pull_request:
    paths:
      - 'backend/ml/gnn/gtn_logistics.py'
      - 'backend/ml/gnn/test_gtn*.py'
      - '.github/workflows/gtn-metapath.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-metapath:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Run actual component without unrelated GNN package startup
        run: |
          mkdir -p "$RUNNER_TEMP/gtn-native"
          cp backend/ml/gnn/gtn_logistics.py backend/ml/gnn/test_gtn.py backend/ml/gnn/test_gtn_metapath.py "$RUNNER_TEMP/gtn-native/"
          PYTHONPATH="$RUNNER_TEMP/gtn-native" python -m pytest "$RUNNER_TEMP/gtn-native/test_gtn.py" "$RUNNER_TEMP/gtn-native/test_gtn_metapath.py" -q
      - run: python -m ruff check backend/ml/gnn/gtn_logistics.py backend/ml/gnn/test_gtn.py backend/ml/gnn/test_gtn_metapath.py
