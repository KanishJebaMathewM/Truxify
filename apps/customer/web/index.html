<!DOCTYPE html>

<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="truxify_customer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Truxify — Customer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Lightweight splash screen -->

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #flutter-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    #flutter-preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader {
      width: 36px;
      height: 36px;

      border: 3px solid #e0e0e0;
      border-top: 3px solid #1976d2;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }
  </style>

</head>

<body>

  <!--
    Lightweight preloader.
    This is displayed immediately while Flutter initializes.
  -->

  <div
    id="flutter-preloader"
    role="status"
    aria-label="Loading Truxify"
  >
    <div class="loader"></div>
  </div>

  <!--
    Hide the preloader when Flutter renders its first frame.
  -->

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const preloader = document.getElementById('flutter-preloader');

      if (preloader) {
        preloader.classList.add('hidden');

        setTimeout(function () {
          preloader.remove();
        }, 300);
      }
    });
  </script>

  <!-- Flutter bootstrap -->

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
