name: GNN restore generation lifetime
on:
  pull_request:
    paths:
      - backend/ml/gnn/models.py
      - backend/ml/gnn/_inference_eval_patch.py
      - backend/ml/routes/gnn_routes.py
      - backend/ml/tests/test_gnn_restore_lifetime.py
      - tools/gnn-restore-tests/requirements.txt
      - .github/workflows/gnn-restore-lifetime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gnn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/gnn-restore-tests/requirements.txt
      - name: Native Torch and PyG lifecycle tests
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_gnn_restore_lifetime.py
      - name: Scoped analysis
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/ml/gnn/models.py backend/ml/gnn/_inference_eval_patch.py
          python -m ruff check backend/ml/tests/test_gnn_restore_lifetime.py
