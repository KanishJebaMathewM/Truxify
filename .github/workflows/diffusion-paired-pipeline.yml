name: Native diffusion paired pipeline
on:
  pull_request:
    paths:
      - 'backend/ml/diffusion/trainer.py'
      - 'backend/ml/tests/test_diffusion_paired_pipeline.py'
      - 'backend/ml/tests/test_diffusion_trainer.py'
      - '.github/workflows/diffusion-paired-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 tqdm==4.67.1 ruff==0.16.9
      - name: Native training and validation pairing
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_diffusion_paired_pipeline.py backend/ml/tests/test_diffusion_trainer.py
      - name: Scoped analysis
        run: python -m ruff check backend/ml/diffusion/trainer.py backend/ml/tests/test_diffusion_paired_pipeline.py --select E9,F63,F7,F82
