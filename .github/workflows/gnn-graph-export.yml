name: GNN raw graph export
on:
  pull_request:
    paths:
      - backend/ml/gnn/models.py
      - backend/ml/gnn/_parallel_edges_patch.py
      - backend/ml/tests/test_gnn_graph_export.py
      - backend/ml/tests/test_gnn_feature_scaling.py
      - backend/ml/tests/test_gnn_parallel_edges.py
      - tools/gnn-export-tests/requirements.txt
      - .github/workflows/gnn-graph-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/gnn-export-tests/requirements.txt
      - name: Native NetworkX PyG scaler and Torch interoperability
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_gnn_graph_export.py backend/ml/tests/test_gnn_feature_scaling.py backend/ml/tests/test_gnn_parallel_edges.py -k 'not selects_the_better and not can_select_parallel'
      - name: Scoped analysis
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/ml/gnn/models.py backend/ml/gnn/_parallel_edges_patch.py
          python -m ruff check backend/ml/tests/test_gnn_graph_export.py
