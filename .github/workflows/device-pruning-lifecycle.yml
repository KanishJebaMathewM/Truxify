name: Device pruning lifecycle
on:
  pull_request:
    paths:
      - 'backend/api/src/workers/devicePruningWorker.js'
      - 'backend/api/test/unit/devicePruningWorker.test.js'
      - 'backend/api/test/unit/devicePruningLifecycle.test.js'
      - 'backend/api/test/helpers/supabaseMock.js'
      - 'backend/api/eslint.config.js'
      - 'tools/device-pruning-tests/**'
      - '.github/workflows/device-pruning-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-pruning-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked focused dependencies
        run: npm ci --prefix tools/device-pruning-tests --ignore-scripts --no-audit --no-fund
      - name: Verify actual worker lifecycle, PostgreSQL predicate and scoped lint
        run: bash tools/device-pruning-tests/run.sh
