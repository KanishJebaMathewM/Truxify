name: Native MAML training transitions
on:
  pull_request:
    paths:
      - 'backend/ml/meta/**'
      - 'backend/ml/routes/meta_routes.py'
      - 'backend/ml/tests/test_maml_training_transition.py'
      - '.github/workflows/maml-training-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-maml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Native higher-order training and existing generation consumers
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_maml_training_transition.py backend/ml/tests/test_maml_checkpoint_generation.py backend/ml/tests/test_maml_inference_contract.py backend/ml/tests/test_meta_task_truth.py backend/ml/tests/test_meta.py -k 'not test_maml_init' -q
      - name: Scoped source analysis
        run: |
          python -m ruff check backend/ml/meta/training_admission.py backend/ml/tests/test_maml_training_transition.py
          python -m ruff check backend/ml/meta/model.py backend/ml/routes/meta_routes.py --select E9,F63,F7,F82,I,F401
