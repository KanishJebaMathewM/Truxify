name: Native diffusion training transitions
on:
  pull_request:
    paths:
      - 'backend/ml/diffusion/trainer.py'
      - 'backend/ml/diffusion/training_transition.py'
      - 'backend/ml/tests/test_diffusion_training_transition.py'
      - '.github/workflows/diffusion-training-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-training:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scoped native dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tqdm==4.67.1 numpy==1.26.4 python-multipart==0.0.20 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Native denoising transitions and existing consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest backend/ml/tests/test_diffusion_training_transition.py backend/ml/tests/test_diffusion_paired_pipeline.py backend/ml/tests/test_diffusion_trainer.py backend/ml/tests/test_diffusion_condition_ownership.py backend/ml/tests/test_diffusion_reverse_schedule.py backend/ml/tests/test_diffusion.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/diffusion/training_transition.py backend/ml/tests/test_diffusion_training_transition.py
          python -m ruff check backend/ml/diffusion/trainer.py --select E9,F63,F7,F82
