name: Spatial booking query observation protocol
on:
  pull_request:
    paths:
      - 'backend/api/src/services/routing/spatialMatcher.js'
      - 'backend/api/src/services/routing/spatialObservation.js'
      - 'backend/api/src/services/routing/driverDispatchPipeline.js'
      - 'backend/api/src/services/routing/corridorService.js'
      - 'backend/api/src/services/routing/profitabilityScorer.js'
      - 'backend/api/test/native/spatialMatcher.node.mjs'
      - 'backend/api/test/native/spatial-deps/**'
      - '.github/workflows/spatial-query-observations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.1'
      - name: Install pinned and locked isolated native SDK dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix backend/api/test/native/spatial-deps
          ln -s "$GITHUB_WORKSPACE/backend/api/test/native/spatial-deps/node_modules" "$GITHUB_WORKSPACE/backend/api/node_modules"
      - name: Actual SDK lookup, time-window and dispatcher checks
        env:
          NODE_ENV: production
          LOG_LEVEL: fatal
        run: node --test backend/api/test/native/spatialMatcher.node.mjs
      - name: Changed-file analysis
        run: backend/api/node_modules/.bin/eslint backend/api/src/services/routing/spatialMatcher.js backend/api/src/services/routing/spatialObservation.js backend/api/test/native/spatialMatcher.node.mjs --config backend/api/eslint.config.js --max-warnings=0
