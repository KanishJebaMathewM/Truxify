name: Native extreme-point support
on:
  pull_request:
    paths:
      - 'backend/ml/services/bin_packing_3d.py'
      - 'backend/ml/services/packing_support.py'
      - 'backend/ml/tests/test_extreme_point_support.py'
      - '.github/workflows/extreme-point-support.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 ruff==0.16.9
      - name: Native emitted geometry and support witnesses
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_extreme_point_support.py -q
      - name: Analyze scoped sources
        run: |
          python -m ruff check backend/ml/services/packing_support.py backend/ml/tests/test_extreme_point_support.py
          python -m ruff check backend/ml/services/bin_packing_3d.py --select E9,F63,F7,F82
