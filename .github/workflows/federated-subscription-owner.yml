
# Validate the native federated subscription lifecycle across dependency versions
name: Native federated subscription lifecycle

# Run when relevant federated-learning files change or manually
on:
  pull_request:
    paths:
      - "backend/ml/federated/**"
      - "backend/ml/tests/test_federated*.py"
      - "backend/ml/routes/federated_routes.py"
      - "docs/architecture/federated-subscription-owner.md"
      - ".github/workflows/federated-subscription-owner.yml"
  workflow_dispatch:

# Restrict permissions to repository read access
permissions:
  contents: read

jobs:
  # Test federated lifecycle recovery across dependency combinations
  native-recovery:
    name: Federated Recovery (TF ${{ matrix.tensorflow }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Test against multiple TensorFlow and Keras versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - tensorflow: "2.16.1"
            keras: "3.3.3"
          - tensorflow: "2.20.0"
            keras: "3.15.1"

    # Configure Python, TensorFlow, and Redis test environment
    env:
      PYTHONPATH: backend/ml
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      # Checkout repository without persisting credentials
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Configure Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      # Install Redis server for federated lifecycle tests
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      # Start Redis and verify that it is ready
      - name: Start Redis
        run: |
          sudo service redis-server start
          redis-cli ping

      # Install the selected TensorFlow and Keras versions and test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            tensorflow-cpu==${{ matrix.tensorflow }} \
            keras==${{ matrix.keras }} \
            numpy==1.26.4 \
            scipy==1.14.1 \
            redis==5.0.8 \
            cryptography==44.0.0 \
            pytest==9.0.3 \
            pytest-asyncio==1.3.0 \
            ruff==0.16.9 \
            fastapi==0.116.1 \
            httpx==0.28.1

      # Run federated subscription, recovery, and protocol tests
      - name: Run federated tests
        run: |
          python -m pytest \
            backend/ml/tests/test_federated_subscription_owner.py \
            backend/ml/tests/test_federated_round_recovery.py \
            backend/ml/tests/test_federated_model_admission.py \
            backend/ml/tests/test_federated.py \
            backend/ml/tests/test_federated_client_round_protocol.py \
            backend/ml/tests/test_federated_update_delivery.py \
            -q

      # Lint the subscription owner implementation and its tests
      - name: Lint subscription owner
        run: |
          python -m ruff check \
            backend/ml/federated/subscription_owner.py \
            backend/ml/tests/test_federated_subscription_owner.py

      # Lint the federated server with project-specific exclusions
      - name: Lint federated server
        run: |
          python -m ruff check \
            backend/ml/federated/federated_server.py \
            --ignore I001,F401,UP035,UP045,UP006,BLE001,S110,SIM102,DTZ005,C401,RUF010

      # Lint the federated client with project-specific exclusions
      - name: Lint federated client
        run: |
          python -m ruff check \
            backend/ml/federated/federated_client.py \
            --ignore I001,F401,UP035,UP045,UP006,BLE001,S110,SIM102,DTZ005,C401,RUF010,F541
