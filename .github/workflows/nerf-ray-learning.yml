name: Native NeRF ray learning
on:
  pull_request:
    paths:
      - 'backend/ml/nerf/**'
      - 'backend/ml/routes/nerf_routes.py'
      - 'backend/ml/tests/test_nerf*.py'
      - '.github/workflows/nerf-ray-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ray-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1 python-multipart==0.0.20 pillow==11.3.0
      - name: Native analytic gradients optimizer and existing render camera consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_nerf_ray_learning.py backend/ml/tests/test_nerf_volume_layout.py backend/ml/tests/test_nerf_camera_geometry.py backend/ml/tests/test_nerf.py
      - name: Source analysis
        run: |
          python -m ruff check backend/ml/nerf/ray_training.py backend/ml/tests/test_nerf_ray_learning.py
          python -m ruff check backend/ml/nerf/model.py backend/ml/routes/nerf_routes.py --select E9,F63,F7,F82,I,F401
