name: Native ETA observations
on:
  pull_request:
    paths:
      - backend/ml/services/_eta_observations.py
      - backend/ml/services/traffic_pipeline.py
      - backend/ml/services/_eta_inference_off_event_loop_patch.py
      - backend/ml/tests/test_eta_observations.py
      - .github/workflows/eta-observations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend/ml:.
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: python -m pip install tensorflow-cpu==2.16.2 keras==3.15.1 numpy==1.26.4 pandas==2.1.4 redis==5.0.8 requests==2.32.3 aiohttp==3.10.11 SQLAlchemy==2.0.36 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.3.0 ruff==0.16.9
      - name: Native observations and existing consumers
        run: >-
          python -m pytest backend/ml/tests/test_eta_observations.py
          backend/ml/tests/test_traffic_pipeline_route_windows.py
          backend/ml/tests/test_eta_update_inference_off_event_loop.py
          backend/ml/tests/test_eta_route_history_version.py
          --deselect=backend/ml/tests/test_eta_update_inference_off_event_loop.py::test_update_eta_uses_bounded_inference_executor -q
      - name: Scoped source analysis
        run: |
          python -m ruff check backend/ml/services/_eta_observations.py backend/ml/tests/test_eta_observations.py
          python -m ruff check backend/ml/services/traffic_pipeline.py backend/ml/services/_eta_inference_off_event_loop_patch.py --ignore I001,F401,UP035,UP006,UP045,RUF013,DTZ005,DTZ003,BLE001,S110,SIM117
