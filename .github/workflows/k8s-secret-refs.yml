name: K8s Secret Reference Validation

on:
  pull_request:
    paths:
      - 'k8s/**'
  push:
    branches:
      - main
    paths:
      - 'k8s/**'

permissions:
  contents: read

jobs:
  validate-secret-refs:
    name: Validate secretKeyRef keys against k8s/secrets.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secretKeyRef references
        run: node .github/scripts/check-k8s-secret-refs.js
