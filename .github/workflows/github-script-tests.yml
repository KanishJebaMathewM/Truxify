name: GitHub script tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/github-script-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/github-script-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run the workflow helper script tests
        run: node --test .github/scripts/*.test.js
