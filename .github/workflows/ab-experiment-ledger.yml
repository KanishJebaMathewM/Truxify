name: A-B experiment ledger
on:
  pull_request:
    paths:
      - 'backend/ml/services/ab_testing.py'
      - 'backend/ml/services/ab_experiment_ledger.py'
      - 'backend/ml/routes/ab_testing.py'
      - 'backend/ml/tests/test_ab_experiment_ledger.py'
      - 'backend/ml/tests/test_ab_testing_model.py'
      - 'backend/ml/tests/test_ab_testing_shadow_metrics.py'
      - '.github/workflows/ab-experiment-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install scoped native dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 sqlalchemy==2.0.36 scikit-learn==1.5.2 pytest==9.0.3 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1 requests==2.34.2 aiohttp==3.13.3 redis==5.0.1
      - name: Verify native ledger and existing comparison contracts
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_ab_experiment_ledger.py backend/ml/tests/test_ab_testing_model.py backend/ml/tests/test_ab_testing_shadow_metrics.py -q
      - name: Analyze changed ledger sources
        run: |
          python -m ruff check backend/ml/services/ab_experiment_ledger.py backend/ml/services/ab_testing.py backend/ml/tests/test_ab_experiment_ledger.py backend/ml/tests/test_ab_testing_model.py backend/ml/tests/test_ab_testing_shadow_metrics.py
          python -m ruff check backend/ml/routes/ab_testing.py --ignore DTZ005,DTZ003,BLE001
