name: Native NeRF image execution
on:
  pull_request:
    paths:
      - backend/ml/nerf/image_rendering.py
      - backend/ml/nerf/model.py
      - backend/ml/routes/nerf_routes.py
      - backend/ml/tests/test_nerf_image_rendering.py
      - backend/ml/tests/test_nerf_ray_learning.py
      - .github/workflows/nerf-image-rendering.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        torch: ['2.8.0', '2.13.0']
    env:
      PYTHONPATH: backend/ml
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 pytest==9.0.3 pytest-asyncio==1.3.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1 pillow==11.3.0 python-multipart==0.0.20
      - run: >-
          python -m pytest backend/ml/tests/test_nerf_image_rendering.py
          backend/ml/tests/test_nerf_volume_layout.py backend/ml/tests/test_nerf.py
          backend/ml/tests/test_nerf_ray_learning.py backend/ml/tests/test_nerf_camera_geometry.py -q
      - run: |
          python -m ruff check backend/ml/nerf/image_rendering.py backend/ml/tests/test_nerf_image_rendering.py backend/ml/tests/test_nerf_ray_learning.py
          python -m ruff check backend/ml/nerf/model.py backend/ml/routes/nerf_routes.py --select E9,F63,F7,F82
