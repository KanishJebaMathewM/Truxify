apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-scaledobject
  namespace: truxify
  labels:
    app: redis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis-deployment
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
  # REDIS_PASSWORD must be injected into the redis-deployment pod via a Secret
  # (e.g. env: - name: REDIS_PASSWORD, valueFrom: { secretKeyRef: ... }).
  - type: redis
    metadata:
      address: redis-service:6379
      passwordFromEnv: REDIS_PASSWORD
      database: "0"
      listName: orders
      listLength: "100"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: postgres-scaledobject
  namespace: truxify
  labels:
    app: postgres
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgres-deployment
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
  # POSTGRES_CONNECTION_STRING must be injected into the postgres-deployment pod
  # via a Secret (envFrom: - secretRef) — no credentials in the manifest.
  - type: postgresql
    metadata:
      connectionFromEnv: POSTGRES_CONNECTION_STRING
      query: "SELECT COUNT(*) FROM orders WHERE status = 'PENDING';"
      targetQueryValue: "50"