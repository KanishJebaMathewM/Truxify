name: Native bilateral observations
on:
  pull_request:
    paths:
      - backend/ml/app/models/bilateral_matcher.py
      - backend/ml/tests/test_bilateral_observations.py
      - .github/workflows/bilateral-observations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend/ml
      TRUXIFY_ML_USE_OSRM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 ruff==0.16.9 requests==2.32.3 scipy==1.14.1 numpy==1.26.4
      - name: Native observation and provider controls
        run: >-
          python -m pytest backend/ml/tests/test_bilateral_observations.py
          backend/ml/tests/test_bilateral_routing_lifetime.py
          backend/ml/tests/test_bilateral_input_validation.py
          backend/ml/tests/test_bilateral_unmatched.py
          backend/ml/tests/test_bilateral_assignment_objective.py
          backend/ml/tests/test_bilateral_matcher_algo.py -q
      - name: Analyze scoped sources
        run: |
          python -m ruff check backend/ml/tests/test_bilateral_observations.py
          python -m ruff check backend/ml/app/models/bilateral_matcher.py --select E9,F63,F7,F82
