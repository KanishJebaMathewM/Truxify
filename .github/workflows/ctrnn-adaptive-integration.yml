name: Native CTRNN adaptive integration
on:
  pull_request:
    paths:
      - 'backend/ml/models/ctrnn_imputer.py'
      - 'backend/ml/tests/test_ctrnn_adaptive_integration.py'
      - '.github/workflows/ctrnn-adaptive-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ctrnn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Native numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.11.3 pytest==9.0.3 ruff==0.16.9
      - name: Native trajectory references and endpoint admission
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest -q backend/ml/tests/test_ctrnn_adaptive_integration.py backend/ml/tests/test_ctrnn_imputer.py
      - name: Scoped analysis
        run: python -m ruff check backend/ml/models/ctrnn_imputer.py backend/ml/tests/test_ctrnn_adaptive_integration.py --select E9,F63,F7,F82
