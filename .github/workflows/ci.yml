name: Truxify CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: truxify-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: backend/api
        run: npm install --workspaces=false --legacy-peer-deps

      - name: Run unit tests
        working-directory: backend/api
        run: npm run test:unit

      - name: Run integration tests
        working-directory: backend/api
        run: npm run test:integration

  ml:
    name: ML engine tests and lint
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/ml/requirements.txt
            backend/ml/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend/ml
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: backend/ml
        run: python -m ruff check .

      - name: Run tests
        working-directory: backend/ml
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

      - name: Run eBPF tests
        run: python -m pytest ebpf/tests -v

  contracts:
    name: Smart contract checks
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        working-directory: blockchain
        run: npm ci

      - name: Run Solhint
        working-directory: blockchain
        run: npx --yes solhint@6.2.4 'contracts/**/*.sol'

      - name: Compile contracts
        working-directory: blockchain
        run: npx hardhat compile

      - name: Run contract tests
        working-directory: blockchain
        run: npx hardhat test

      - name: Verify backend ABI selectors match compiled contract
        run: bash scripts/check-escrow-abi.sh

  client-credentials-guard:
    name: No client-side backend credentials
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check for Redis/Upstash credentials in Flutter source
        run: bash scripts/check-no-client-credentials.sh
