name: Native MoCo forward candidates
on:
  pull_request:
    paths:
      - 'backend/ml/self_supervised/**'
      - 'backend/ml/tests/test_moco*.py'
      - 'backend/ml/tests/test_simclr_pair_objective.py'
      - 'backend/ml/tests/test_mae_observation_objective.py'
      - '.github/workflows/moco-forward-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-moco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Native candidate derivatives and existing SSL consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_moco_forward_candidate.py backend/ml/tests/test_moco_key_queue_protocol.py backend/ml/tests/test_simclr_pair_objective.py backend/ml/tests/test_mae_observation_objective.py
      - name: Source analysis
        run: |
          python -m ruff check backend/ml/self_supervised/moco_transition.py backend/ml/tests/test_moco_forward_candidate.py
          python -m ruff check backend/ml/self_supervised/model.py --select E9,F63,F7,F82,I,F401
