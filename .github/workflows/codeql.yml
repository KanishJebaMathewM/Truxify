
# Automatically scan the repository for security vulnerabilities and code quality issues
name: CodeQL Advanced

# Trigger CodeQL on pushes, pull requests, and scheduled scans
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "40 17 * * 2"

jobs:
  # Analyze each configured programming language
  analyze:
    name: Analyze (${{ matrix.language }})

    # Use the appropriate runner for the selected language
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 30

    # Grant permissions required for security scanning
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    # Analyze languages independently
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      # Checkout the repository without persisting credentials
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Initialize CodeQL for the selected language
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Run manual build commands only when manual build mode is configured
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "Configure the manual build commands for CodeQL here."
          echo "Example:"
          echo "  make bootstrap"
          echo "  make release"
          exit 1

      # Perform security analysis and upload the results
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: "/language:${{ matrix.language }}"
