
sonar.projectKey=KanishJebaMathewM_Truxify
sonar.organization=kanishjebamathewm-truxify
sonar.projectName=Truxify

# Source directories
sonar.sources=backend/api,backend/ml,apps/driver/lib,apps/customer/lib,packages

# Exclude generated files, dependencies and tests
sonar.exclusions=**/node_modules/**,**/*.spec.js,**/*.test.js,**/tests/**,**/*.g.dart,**/*.freezed.dart,**/.dart_tool/**,**/build/**,**/coverage/**

# JavaScript coverage
sonar.javascript.lcov.reportPaths=backend/api/coverage/lcov.info

# Python coverage
sonar.python.coverage.reportPaths=backend/ml/coverage.xml

# Dart / Flutter coverage
sonar.dart.coverage.reportPaths=apps/driver/coverage/lcov.info,apps/customer/coverage/lcov.info
