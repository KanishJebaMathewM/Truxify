name: K8s Istio Manifest Validation

on:
  pull_request:
    paths:
      - 'k8s/istio/**'
  push:
    branches:
      - main
    paths:
      - 'k8s/istio/**'

permissions:
  contents: read

jobs:
  validate-istio-manifests:
    name: Validate k8s/istio YAML manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for BOMs and duplicate mapping keys
        run: node .github/scripts/check-istio-manifests.js
