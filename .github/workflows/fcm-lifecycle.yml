name: FCM lifecycle snapshots
on:
  pull_request:
    paths:
      - backend/api/src/services/notificationService.js
      - supabase/migrations/20261003034625_fcm_lifecycle_snapshot.sql
      - tools/fcm-lifecycle-tests/**
      - .github/workflows/fcm-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/fcm-lifecycle-tests/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
        working-directory: tools/fcm-lifecycle-tests
      - run: bash tools/fcm-lifecycle-tests/run.sh
