name: FedAvg numerical publication
on:
  pull_request:
    paths:
      - 'backend/ml/federated/fl_server.py'
      - 'backend/ml/tests/test_fedavg_publication.py'
      - '.github/workflows/fedavg-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-fedavg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native scoped dependencies
        run: python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Verify weighted publication and existing median contracts
        env:
          PYTHONPATH: backend/ml:backend/ml/federated
        run: python -m pytest backend/ml/tests/test_fedavg_publication.py backend/ml/tests/test_fl_server.py backend/ml/tests/test_federated_stable_projection.py backend/ml/federated/test_fedavg.py -q
      - name: Analyze changed sources
        run: python -m ruff check backend/ml/federated/fl_server.py backend/ml/tests/test_fedavg_publication.py
