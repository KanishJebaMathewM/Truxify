
name: Remove Links from Non-Contributors

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Scan and clean all existing issues, PRs, and comments'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  remove-links:
    name: Remove Unwanted Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Remove links posted by non-contributors
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const path = `${process.env.GITHUB_WORKSPACE}/.github/scripts/remove-non-contributor-links.js`;
            const cleaner = require(path);

            core.info(`Loaded cleaner module from: ${path}`);
            core.info(`Available exports: ${Object.keys(cleaner).join(', ')}`);
            core.info(`typeof cleaner.run: ${typeof cleaner.run}`);
            core.info(`typeof cleaner.scanAll: ${typeof cleaner.scanAll}`);

            if (typeof cleaner.run !== 'function') {
              throw new Error(
                'remove-non-contributor-links.js must export run() using module.exports'
              );
            }

            if (typeof cleaner.scanAll !== 'function') {
              throw new Error(
                'remove-non-contributor-links.js must export scanAll() using module.exports'
              );
            }

            const scanAll =
              context.eventName === 'workflow_dispatch' &&
              context.payload.inputs?.scan_all === 'true';

            if (scanAll) {
              await cleaner.scanAll({ github, context, core });
            } else {
              await cleaner.run({ github, context, core });
            }
