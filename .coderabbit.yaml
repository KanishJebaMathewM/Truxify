
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

tone_instructions: >-
  You are an experienced software engineer providing clear,
  actionable, and concise code reviews.
  Focus on bugs, security issues, maintainability,
  and practical improvements.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Disable automatic reviews
  auto_review:
    enabled: false
    drafts: false

  # Exclude dependency and generated files
  path_filters:
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"

chat:
  auto_reply: true

