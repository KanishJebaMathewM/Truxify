name: Native foundation finetuning
on:
  pull_request:
    paths:
      - 'backend/ml/foundation/**'
      - 'backend/ml/routes/foundation_routes.py'
      - 'backend/ml/tests/test_foundation*.py'
      - '.github/workflows/foundation-finetuning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-finetuning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9 fastapi==0.116.1 httpx==0.28.1 python-multipart==0.0.20
      - name: Native finetuning and existing attention MLM upload consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_foundation_finetuning.py backend/ml/tests/test_foundation.py backend/ml/tests/test_foundation_attention_masks.py backend/ml/tests/test_foundation_data.py backend/ml/tests/test_foundation_mlm_objective.py backend/ml/tests/test_foundation_validation.py -k 'not test_create_pretraining_data_shape'
      - name: Source analysis
        run: |
          python -m ruff check backend/ml/foundation/finetuning.py backend/ml/tests/test_foundation_finetuning.py
          python -m ruff check backend/ml/foundation/model.py backend/ml/routes/foundation_routes.py --select E9,F63,F7,F82,I,F401
