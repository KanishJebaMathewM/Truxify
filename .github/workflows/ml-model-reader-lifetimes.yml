name: ML model reader lifetimes
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/base.py'
      - 'backend/ml/app/models/price_prediction.py'
      - 'backend/ml/app/models/driver_profit.py'
      - 'backend/ml/tests/test_model_snapshot_consumers.py'
      - 'backend/ml/tests/test_model_reader_lifetimes.py'
      - 'backend/ml/tests/test_model_mutation_ownership.py'
      - 'backend/ml/app/models/generation_maintenance.py'
      - '.github/workflows/ml-model-reader-lifetimes.yml'
permissions:
  contents: read
jobs:
  generation-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 fastapi==0.142.2 requests==2.34.2 ruff==0.16.9 numpy==1.26.4 scipy==1.11.3 scikit-learn==1.9.0 httpx==0.27.0
      - name: Analyze new lifetime regressions
        run: python -m ruff check backend/ml/tests/test_model_reader_lifetimes.py backend/ml/tests/test_model_snapshot_consumers.py backend/ml/tests/test_model_mutation_ownership.py backend/ml/app/models/generation_maintenance.py
      - name: Analyze scoped legacy persistence source
        run: python -m ruff check backend/ml/app/models/base.py --ignore BLE001,UP045,DTZ005,SIM115
      - name: Verify native reader and publication lifetimes
        run: python -m pytest -q backend/ml/tests/test_model_reader_lifetimes.py backend/ml/tests/test_model_snapshot_consumers.py backend/ml/tests/test_model_mutation_ownership.py
      - name: Verify core persistence compatibility (existing legacy sidecar fixture class excluded)
        env:
          MODEL_ARTIFACT_HMAC_KEY: isolated-native-persistence-test-fixture
          MODEL_ARTIFACT_SIGNATURE_DIR: /tmp/truxify-persistence-fixture-signatures
        run: python -m pytest -q backend/ml/tests/test_base.py -k "not TestModelIntegrity"
