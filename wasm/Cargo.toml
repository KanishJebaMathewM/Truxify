[package]
name = "truxify_wasm_routing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ed25519_dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["os_rng"] }
