name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: truxify-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend/api
        run: npm install --workspaces=false --legacy-peer-deps --ignore-scripts
      - name: Run ESLint
        working-directory: backend/api
        run: npm run lint

  customer-lint:
    name: Customer App Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Get shared dependencies
        working-directory: packages/truxify_shared
        run: flutter pub get
      - name: Get dependencies
        working-directory: apps/customer
        run: flutter pub get
      - name: Run Flutter Analyzer
        working-directory: apps/customer
        run: flutter analyze
      - name: Run Dart Format
        working-directory: apps/customer
        run: dart format --output=none --set-exit-if-changed .

  driver-lint:
    name: Driver App Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Get shared dependencies
        working-directory: packages/truxify_shared
        run: flutter pub get
      - name: Get dependencies
        working-directory: apps/driver
        run: flutter pub get
      - name: Run Flutter Analyzer
        working-directory: apps/driver
        run: flutter analyze
      - name: Run Dart Format
        working-directory: apps/driver
        run: dart format --output=none --set-exit-if-changed .

  sonarcloud:
    name: SonarCloud Scan
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
