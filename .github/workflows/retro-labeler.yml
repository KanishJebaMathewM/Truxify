name: Retrospective PR Labeler

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (only log modifications, do not apply changes)'
        type: boolean
        required: false
        default: false
      pr_state:
        description: 'PR state to process (open, closed, or all)'
        type: choice
        options:
          - closed
          - open
          - all
        required: false
        default: closed
      since_hours:
        description: 'Only process PRs updated/closed within last N hours (0 for all)'
        type: string
        required: false
        default: '12'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  retro-label:
    name: Retro-label Closed PRs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run retrospective PR labeler
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PR_STATE: ${{ inputs.pr_state || 'closed' }}
          SINCE_HOURS: ${{ inputs.since_hours || '12' }}
        with:
          script: |
            const labeler = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/retro-labeler.js`);
            await labeler.run({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true',
              prState: process.env.PR_STATE || 'closed',
              sinceHours: parseFloat(process.env.SINCE_HOURS || '12')
            });
