name: Native anomaly temporal cache
on:
  pull_request:
    paths:
      - backend/ml/anomaly/**
      - backend/ml/tests/test_anomaly_window_cache.py
      - backend/ml/tests/test_anomaly_generation_contract.py
      - backend/ml/tests/test_anomaly_reporting.py
      - backend/ml/tests/test_autoencoder_shared_topology.py
      - .github/workflows/anomaly-window-cache.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend/ml
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          python -m pip install tensorflow-cpu==2.16.2 keras==3.15.1 numpy==1.26.4 scipy==1.14.1 pandas==2.1.4 redis==5.0.8 scikit-learn==1.5.2 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 ruff==0.16.9
      - name: Native bounded state and existing consumers
        run: >-
          python -m pytest backend/ml/tests/test_anomaly_window_cache.py
          backend/ml/tests/test_anomaly_generation_contract.py
          backend/ml/tests/test_autoencoder_shared_topology.py
          backend/ml/tests/test_anomaly_reporting.py -q
      - name: Scoped source analysis
        run: |
          python -m ruff check backend/ml/tests/test_anomaly_window_cache.py backend/ml/tests/test_anomaly_generation_contract.py backend/ml/tests/test_anomaly_reporting.py
          python -m ruff check backend/ml/anomaly/detector.py --ignore I001,F401,UP035,UP006,UP045,RUF013,PERF102,DTZ005,BLE001
