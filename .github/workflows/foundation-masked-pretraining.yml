name: Foundation masked pretraining
on:
  pull_request:
    paths:
      - 'backend/ml/foundation/**'
      - 'backend/ml/routes/foundation_routes.py'
      - 'backend/ml/tests/test_foundation_mlm_objective.py'
      - 'backend/ml/tests/test_mlm_optimizer_transition.py'
      - '.github/workflows/foundation-masked-pretraining.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend/ml
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - run: python -m ruff check backend/ml/foundation/pretraining.py backend/ml/foundation/optimizer_transition.py backend/ml/tests/test_foundation_mlm_objective.py backend/ml/tests/test_mlm_optimizer_transition.py
      - run: python -m ruff check backend/ml/foundation/data.py backend/ml/foundation/model.py backend/ml/routes/foundation_routes.py --select E9,F63,F7,F82
      - run: python -m pytest -q backend/ml/tests/test_foundation_mlm_objective.py backend/ml/tests/test_mlm_optimizer_transition.py
