# THIS FILE MUST NOT CONTAIN PLAINTEXT SECRET VALUES.
#
# The plaintext placeholder manifest `k8s/secrets.yaml` has been removed so a
# deploy can never clobber real cluster secrets with publicly committed values.
# The keys below document what the `truxify-secrets` Secret must contain.
# Values are injected from a secret manager (Vault / SOPS / SealedSecrets /
# external-secrets) or from CI-injected `kubectl create secret` literals at
# deploy time. See scripts/deploy-k8s.sh.
---
apiVersion: v1
kind: Secret
metadata:
  name: truxify-secrets
  namespace: truxify
type: Opaque
data:
  ML_API_KEY: ""
  POLYGON_RPC_URL: ""
  ESCROW_CONTRACT_ADDRESS: ""
  RELAYER_WALLET_PRIVATE_KEY: ""
  SUPABASE_URL: ""
  SUPABASE_ANON_KEY: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  WEBHOOK_SECRET: ""
  JWT_SECRET: ""
  SHARD_PASSWORD_NORTH: ""
  SHARD_PASSWORD_SOUTH: ""
  SHARD_PASSWORD_EAST: ""
  SHARD_PASSWORD_WEST: ""
