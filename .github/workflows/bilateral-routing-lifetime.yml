name: Bilateral routing lifetime
on:
  pull_request:
    paths:
      - backend/ml/app/models/bilateral_matcher.py
      - backend/ml/tests/test_bilateral_matcher_algo.py
      - backend/ml/tests/test_bilateral_routing_lifetime.py
      - tools/bilateral-routing-tests/**
      - .github/workflows/bilateral-routing-lifetime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/bilateral-routing-tests/requirements.txt
      - run: python -m pip install -r tools/bilateral-routing-tests/requirements.txt
      - run: python -m pytest backend/ml/tests/test_bilateral_routing_lifetime.py backend/ml/tests/test_bilateral_matcher_algo.py -q
        env:
          PYTHONPATH: backend/ml
          TRUXIFY_ML_USE_OSRM: 'false'
      - run: ruff check backend/ml/tests/test_bilateral_routing_lifetime.py
      - run: ruff check --select E9,F63,F7,F82 backend/ml/app/models/bilateral_matcher.py backend/ml/tests/test_bilateral_matcher_algo.py
