name: Native NAS search lifecycle
on:
  pull_request:
    paths:
      - backend/ml/nas/model.py
      - backend/ml/routes/nas_routes.py
      - backend/ml/tests/test_nas_lifecycle.py
      - backend/ml/tests/test_nas_identity.py
      - .github/workflows/nas-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-nas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.8.0', '2.13.0']
    env:
      PYTHONPATH: backend/ml
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused CPU dependencies
        run: |
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 ruff==0.16.9
      - name: Actual native lifecycle, ASGI and existing algorithm controls
        run: >-
          python -m pytest backend/ml/tests/test_nas_lifecycle.py
          backend/ml/tests/test_nas_identity.py
          backend/ml/tests/test_nas_construction_plan.py
          backend/ml/tests/test_nas_controller_policy.py
          backend/ml/tests/test_nas.py -q
      - name: Scoped source analysis
        run: |
          python -m ruff check backend/ml/tests/test_nas_lifecycle.py
          python -m ruff check backend/ml/nas/model.py --select E9,F63,F7,F82,I,F401
          python -m ruff check backend/ml/routes/nas_routes.py backend/ml/tests/test_nas_identity.py --select E9,F63,F7,F82
