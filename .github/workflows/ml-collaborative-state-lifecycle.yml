name: ML collaborative state lifecycle
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/collaborative_filter.py'
      - 'backend/ml/tests/test_collaborative_state_lifecycle.py'
      - 'backend/ml/tests/test_collaborative_filter_topn_validation.py'
      - 'backend/ml/tests/test_collaborative_filter_missing_ratings.py'
      - '.github/workflows/ml-collaborative-state-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collaborative-state-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused recommendation dependencies
        run: python -m pip install pytest==9.1.1 numpy==2.5.3 fastapi==0.142.2 requests==2.34.2 ruff==0.16.9
      - name: Test state publication and existing ranking invariants
        run: >-
          python -m pytest backend/ml/tests/test_collaborative_state_lifecycle.py
          backend/ml/tests/test_collaborative_filter_topn_validation.py
          backend/ml/tests/test_collaborative_filter_missing_ratings.py -q
      - name: Analyze new tests and compile production model
        run: |
          ruff check backend/ml/tests/test_collaborative_state_lifecycle.py
          python -m py_compile backend/ml/app/models/collaborative_filter.py
