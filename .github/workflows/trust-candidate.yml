name: Native trust candidate admission
on:
  pull_request:
    paths:
      - backend/ml/app/models/trust_candidate.py
      - backend/ml/app/models/trust_scorer.py
      - backend/ml/tests/test_trust_candidate.py
      - backend/ml/tests/test_trust_scorer_lifecycle.py
      - .github/workflows/trust-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        sklearn: ['1.5.2', '1.9.0']
    env:
      PYTHONPATH: backend/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused native dependencies
        run: python -m pip install scikit-learn==${{ matrix.sklearn }} numpy==1.26.4 scipy==1.14.1 pandas==2.1.4 fastapi==0.116.1 requests==2.32.3 pytest==9.0.3 ruff==0.16.9
      - name: Native admission, lifecycle and formula witnesses
        run: python -m pytest backend/ml/tests/test_trust_candidate.py backend/ml/tests/test_trust_scorer_lifecycle.py backend/ml/tests/test_trust_scorer.py -q
      - name: Source analysis
        run: python -m ruff check backend/ml/app/models/trust_candidate.py backend/ml/app/models/trust_scorer.py backend/ml/tests/test_trust_candidate.py backend/ml/tests/test_trust_scorer_lifecycle.py
