name: Linear density normalization
on:
  pull_request:
    paths:
      - 'backend/ml/models/cnf_density.py'
      - 'backend/ml/models/test_cnf*.py'
      - '.github/workflows/linear-density-normalization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 scipy==1.14.1 pytest==9.0.3 ruff==0.16.9
      - run: PYTHONPATH=backend/ml/models python -m pytest backend/ml/models/test_cnf.py backend/ml/models/test_cnf_normalization.py -q
      - run: python -m ruff check backend/ml/models/cnf_density.py backend/ml/models/test_cnf.py backend/ml/models/test_cnf_normalization.py
