name: Native PINN coordinate derivatives
on:
  pull_request:
    paths:
      - 'backend/ml/pinns/model.py'
      - 'backend/ml/tests/test_pinn_coordinate_derivatives.py'
      - '.github/workflows/pinn-coordinate-derivatives.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 torch-geometric==2.6.1 networkx==3.7 pytest==9.0.3 pytest-asyncio==1.4.0 fastapi==0.116.1 httpx==0.28.1 ruff==0.16.9
      - name: Native PDE derivatives and ASGI training
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_pinn_coordinate_derivatives.py backend/ml/tests/test_pinns.py backend/ml/tests/test_physics_loss.py -k "not test_slope_interpreted_as_degrees_matches_radian_analytic_value"
      - name: Scoped analysis
        run: python -m ruff check backend/ml/pinns/model.py backend/ml/tests/test_pinn_coordinate_derivatives.py --select E9,F63,F7,F82
