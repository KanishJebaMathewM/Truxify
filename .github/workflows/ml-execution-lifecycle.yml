name: ML execution lifecycle
on:
  pull_request:
    paths:
      - 'backend/ml/app/execution.py'
      - 'backend/ml/services/traffic_pipeline.py'
      - 'backend/ml/routes/eta_routes.py'
      - 'backend/ml/tests/test_execution.py'
      - 'backend/ml/tests/test_inference_admission_lifecycle.py'
      - 'backend/ml/tests/test_eta*'
      - '.github/workflows/ml-execution-lifecycle.yml'
permissions:
  contents: read
jobs:
  bounded-native-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused execution dependencies
        run: >-
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 fastapi==0.142.2
          numpy==2.5.3 pandas==3.0.6 SQLAlchemy==2.1.1 aiohttp==3.14.3
          redis==8.1.0 requests==2.34.2 ruff==0.16.9 httpx==0.28.1
      - name: Analyze changed execution modules
        run: >-
          python -m ruff check backend/ml/app/execution.py
          backend/ml/tests/test_execution.py backend/ml/tests/test_inference_admission_lifecycle.py
      - name: Verify native admission and training lifecycle
        run: >-
          python -m pytest -q backend/ml/tests/test_execution.py
          backend/ml/tests/test_inference_admission_lifecycle.py
          backend/ml/tests/test_eta_training_isolation.py
          backend/ml/tests/test_eta_validation_split.py
      - name: Verify actual ETA route with provider doubles
        run: |
          python - <<'PY'
          import pathlib, sys, types, pytest
          # Import actual ETA routes without unrelated GNN/PyTorch initialization.
          routes = types.ModuleType('routes')
          routes.__path__ = [str(pathlib.Path('backend/ml/routes').resolve())]
          sys.modules['routes'] = routes
          raise SystemExit(pytest.main(['-q',
              'backend/ml/tests/test_eta_route_authorization.py',
              'backend/ml/tests/test_eta_routes_input_integrity.py']))
          PY

      - name: Verify invalid speed-to-duration fallback
        run: python -m pytest -q backend/ml/tests/test_eta_conversion_finite.py
