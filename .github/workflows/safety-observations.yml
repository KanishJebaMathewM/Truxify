name: Safety observation protocol
on:
  pull_request:
    paths:
      - 'backend/ml/multimodal/sensor_fusion.py'
      - 'backend/ml/routes/safety*routes.py'
      - 'backend/ml/tests/test_safety_observations.py'
      - '.github/workflows/safety-observations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install native Redis and scoped dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          python -m pip install redis==5.0.0 fastapi==0.116.1 httpx==0.27.0 pytest==9.0.3 ruff==0.16.9
      - name: Verify actual Redis and HTTP observation contract
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_safety_observations.py backend/ml/tests/test_multimodal.py -q
      - name: Analyze changed protocol sources
        run: |
          python -m ruff check backend/ml/multimodal/sensor_fusion.py backend/ml/routes/safety_fusion_routes.py backend/ml/tests/test_safety_observations.py
          python -m ruff check backend/ml/routes/safety_routes.py --ignore B008,BLE001,DTZ005,RUF059
