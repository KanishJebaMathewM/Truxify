name: Native mid-trip candidate batches
on:
  pull_request:
    paths:
      - backend/ml/app/models/mid_trip_reoptimiser.py
      - backend/ml/tests/test_mid_trip_batches.py
      - backend/ml/tests/test_mid_trip_reachability.py
      - .github/workflows/mid-trip-batches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend/ml
      OSRM_BASE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.3 ruff==0.16.9 requests==2.32.3 scipy==1.14.1 numpy==1.26.4
      - name: Native provider batches, global ranking and existing controls
        run: >-
          python -m pytest backend/ml/tests/test_mid_trip_batches.py
          backend/ml/tests/test_mid_trip_insertion_complexity.py
          backend/ml/tests/test_mid_trip_deadline_insertion.py
          backend/ml/tests/test_mid_trip_payment_validation.py
          backend/ml/tests/test_mid_trip_road_eta.py
          backend/ml/tests/test_mid_trip_model.py
          backend/ml/tests/test_mid_trip_reachability.py -q
      - name: Scoped source analysis
        run: |
          python -m ruff check backend/ml/tests/test_mid_trip_batches.py
          python -m ruff check backend/ml/app/models/mid_trip_reoptimiser.py --select E9,F63,F7,F82
