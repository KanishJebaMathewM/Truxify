name: Native MTL checkpoint generations
on:
  pull_request:
    paths:
      - 'backend/ml/mtl/**'
      - 'backend/ml/routes/mtl_routes.py'
      - 'backend/ml/tests/test_mtl_checkpoint_generation.py'
      - 'backend/ml/tests/test_mtl_classification_logits.py'
      - '.github/workflows/mtl-checkpoint-generation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-mtl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Native checkpoint, continuation and existing mixed-task consumers
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_mtl_checkpoint_generation.py backend/ml/tests/test_mtl_classification_logits.py backend/ml/tests/test_mtl_target_pipeline.py backend/ml/tests/test_mtl.py -k 'not test_mtl_init' -q
      - name: Scoped source analysis
        run: |
          python -m ruff check backend/ml/mtl/checkpoint_generation.py backend/ml/tests/test_mtl_checkpoint_generation.py
          python -m ruff check backend/ml/mtl/model.py backend/ml/routes/mtl_routes.py backend/ml/tests/test_mtl_classification_logits.py --select E9,F63,F7,F82,I,F401
