name: Price training admission
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/**'
      - 'backend/ml/app/execution.py'
      - 'backend/ml/tests/test_price_training_admission.py'
      - 'tools/price-training-tests/**'
      - '.github/workflows/price-training-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-training:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -r tools/price-training-tests/requirements.txt
      - name: Verify native fit and artifact preservation
        run: python -m pytest backend/ml/tests/test_price_training_admission.py -q
      - name: Analyze tests and production syntax
        run: |
          ruff check backend/ml/tests/test_price_training_admission.py
          ruff check --select E9,F63,F7,F82 backend/ml/app/models/price_prediction.py
          python -m py_compile backend/ml/app/models/price_prediction.py
