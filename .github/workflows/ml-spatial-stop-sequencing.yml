name: ML spatial stop sequencing
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/bin_packing.py'
      - 'backend/ml/app/models/_bin_packing_validation_patch.py'
      - 'backend/ml/tests/test_bin_packing_spatial_sequence.py'
      - 'backend/ml/tests/test_bin_packing_algo.py'
      - '.github/workflows/ml-spatial-stop-sequencing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-stop-sequencing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install minimal algorithm dependencies
        run: python -m pip install pytest==9.1.1 scipy==1.11.3 numpy==1.26.4 ruff==0.16.9 fastapi==0.142.2 requests==2.34.2
      - name: Test spatial sequencing and existing packing algorithm
        env:
          PYTHONPATH: backend/ml
        run: |
          python -m pytest backend/ml/tests/test_bin_packing_spatial_sequence.py backend/ml/tests/test_bin_packing_algo.py -q
          ruff check backend/ml/tests/test_bin_packing_spatial_sequence.py backend/ml/app/models/_bin_packing_validation_patch.py
          python -m py_compile backend/ml/app/models/bin_packing.py backend/ml/app/models/_bin_packing_validation_patch.py
