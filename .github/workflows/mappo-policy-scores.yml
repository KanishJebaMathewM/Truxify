name: Native standalone fleet policy scores
on:
  pull_request:
    paths:
      - 'backend/ml/marl/mappo_fleet.py'
      - 'backend/ml/marl/policy_scores.py'
      - 'backend/ml/tests/test_mappo_policy_scores.py'
      - '.github/workflows/mappo-policy-scores.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Verify native policy and independent high precision oracle
        env:
          PYTHONPATH: backend/ml:backend/ml/marl
        run: python -m pytest backend/ml/tests/test_mappo_policy_scores.py backend/ml/marl/test_mappo.py -q
      - name: Analyze changed sources
        run: python -m ruff check backend/ml/marl/mappo_fleet.py backend/ml/marl/policy_scores.py backend/ml/tests/test_mappo_policy_scores.py
