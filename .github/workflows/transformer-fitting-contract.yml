name: Native Transformer fitting contract
on:
  pull_request:
    paths:
      - 'backend/ml/transformers/**'
      - 'backend/ml/routes/transformer_routes.py'
      - 'backend/ml/tests/test_transformer*.py'
      - '.github/workflows/transformer-fitting-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-fitting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scoped native dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 fastapi==0.116.1 httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 ruff==0.16.9
      - name: Native fitting and existing generation, timeout and route-schema consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest backend/ml/tests/test_transformer_fitting_contract.py backend/ml/tests/test_transformer_generations.py backend/ml/tests/test_transformers.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/transformers/training_contract.py backend/ml/tests/test_transformer_fitting_contract.py
          python -m ruff check backend/ml/transformers/model.py --ignore I001,PLR0402,UP035,UP045,UP006
          python -m ruff check backend/ml/routes/transformer_routes.py --ignore I001,UP035,UP045,UP006,DTZ005,BLE001
