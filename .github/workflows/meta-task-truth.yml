name: Meta binary task truth
on:
  pull_request:
    paths:
      - backend/ml/meta/model.py
      - backend/ml/routes/meta_routes.py
      - backend/ml/tests/test_meta_task_truth.py
      - tools/meta-task-tests/requirements.txt
      - .github/workflows/meta-task-truth.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/meta-task-tests/requirements.txt
      - name: Native conditional Gaussian support query truth and ASGI
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_meta_task_truth.py
      - name: Scoped analysis
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/ml/meta/model.py backend/ml/routes/meta_routes.py
          python -m ruff check backend/ml/tests/test_meta_task_truth.py
