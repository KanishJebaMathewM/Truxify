name: Native CVRPTW feasibility
on:
  pull_request:
    paths:
      - 'backend/ml/services/cvrptw_solver.py'
      - 'backend/ml/tests/test_cvrptw_feasibility.py'
      - '.github/workflows/cvrptw-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cvrptw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native test dependencies
        run: python -m pip install pytest==9.0.3 ruff==0.16.9
      - name: Independent feasibility oracle and itinerary replay
        run: python -m pytest -q backend/ml/tests/test_cvrptw_feasibility.py
      - name: Changed-file lint
        run: python -m ruff check backend/ml/services/cvrptw_solver.py backend/ml/tests/test_cvrptw_feasibility.py
