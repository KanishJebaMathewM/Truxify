name: GAT native tensor contract
on:
  pull_request:
    paths:
      - backend/ml/gat/model.py
      - backend/ml/tests/test_gat_tensor_contract.py
      - backend/ml/tests/test_gat_temporal.py
      - tools/gat-tensor-tests/requirements.txt
      - .github/workflows/gat-tensor-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/gat-tensor-tests/requirements.txt
      - name: Native PyG spatial temporal trainer and ASGI contract
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_gat_tensor_contract.py backend/ml/tests/test_gat_temporal.py
      - name: Scoped analysis
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/ml/gat/model.py
          python -m ruff check backend/ml/tests/test_gat_tensor_contract.py
