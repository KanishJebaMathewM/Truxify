name: Native collaborative payload contract
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/collaborative*.py'
      - 'backend/ml/tests/test_collaborative*.py'
      - '.github/workflows/collaborative-payload-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scoped native dependencies
        run: python -m pip install numpy==1.26.4 requests==2.32.5 pytest==9.0.3 ruff==0.16.9
      - name: Native candidates, recommendations and previous lifecycle consumers
        env:
          PYTHONPATH: backend/ml
        run: python -m pytest backend/ml/tests/test_collaborative_payload_contract.py backend/ml/tests/test_collaborative_state_lifecycle.py backend/ml/tests/test_collaborative_filter_topn_validation.py backend/ml/tests/test_collaborative_filter_missing_ratings.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/app/models/collaborative_payload.py backend/ml/tests/test_collaborative_payload_contract.py
          python -m ruff check backend/ml/app/models/collaborative_filter.py --ignore I001,UP035,UP045,UP006,TRY004
