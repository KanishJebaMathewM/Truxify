name: Supabase CI

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'

jobs:
  db-check:
    name: Database Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check for duplicate migration contents
        shell: bash
        run: |
          duplicates=$(find supabase/migrations -type f -name '*.sql' -print0 |
            xargs -0 sha256sum |
            sort |
            awk '
              {
                hash=$1
                file=$2
                if (hash == previous) {
                  print previous_file
                  print file
                  found=1
                }
                previous=hash
                previous_file=file
              }
              END {
                if (found) exit 1
              }
            ')

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration contents found:"
            echo "$duplicates"
            exit 1
          fi

          echo "No duplicate migration contents found."

      - name: Check for duplicate CREATE TABLE definitions across migrations
        run: |
          tables=$(grep -rhoE 'CREATE TABLE( IF NOT EXISTS)? [A-Za-z0-9_.]+' supabase/migrations/ | sed -E 's/^CREATE TABLE( IF NOT EXISTS)? //; s/^[A-Za-z0-9_]+\.//' | sort)
          dups=$(echo "$tables" | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate CREATE TABLE definitions found for table(s):"
            echo "$dups"
            echo "Consolidate each table into exactly one migration."
            exit 1
          fi
          echo "No duplicate CREATE TABLE definitions."

      - name: Check SECURITY DEFINER functions pin search_path
        run: python3 scripts/check-definer-search-path.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Start Supabase locally and run migrations
        run: supabase start

      - name: Lint database schema
        run: supabase db lint
