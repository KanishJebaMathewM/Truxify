name: Native inverse reward transitions
on:
  pull_request:
    paths:
      - 'backend/ml/imitation/**'
      - 'backend/ml/foundation/optimizer_transition.py'
      - 'backend/ml/tests/test_inverse_reward_transition.py'
      - 'backend/ml/tests/test_imitation.py'
      - 'backend/ml/tests/test_cloning_objective.py'
      - 'backend/ml/tests/test_reinforce_logit_contract.py'
      - '.github/workflows/inverse-reward-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scoped native dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Native reward updates and existing cloning/policy consumers
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest backend/ml/tests/test_inverse_reward_transition.py backend/ml/tests/test_imitation.py backend/ml/tests/test_cloning_objective.py backend/ml/tests/test_reinforce_logit_contract.py -q
      - name: Analyze new and scoped legacy sources
        run: |
          python -m ruff check backend/ml/imitation/reward_transition.py backend/ml/tests/test_inverse_reward_transition.py
          python -m ruff check backend/ml/imitation/model.py --ignore I001,PLR0402,UP035,UP045,UP006,F401,F541,SIM102
